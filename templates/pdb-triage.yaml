{{- if and .Values.triage.enabled .Values.triage.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nectar-freshdesk.fullname" . }}-triage
  labels:
    {{- include "nectar-freshdesk.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.triage.pdb.minAvailable | default 0 }}
  selector:
    matchLabels:
      {{- include "nectar-freshdesk.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: triage
{{- end }}
